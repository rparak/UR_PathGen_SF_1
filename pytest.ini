[pytest]
# importlib: several test_core.py files coexist without __init__.py. No -q here: with it, the
# documented 'pytest -q' and 'pytest --collect-only -q' lose their totals.
addopts = --import-mode=importlib
testpaths = test
markers =
    slow: takes more than about 30 s (deselect with -m "not slow")
