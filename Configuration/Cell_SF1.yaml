## =========================================================================== ##
# Description:
#   Cell configuration of the SF1 workcell: a Universal Robots UR10e with a Robotiq 2F-85
#   gripper on a coupling, standing on a table, surrounded by the environment in
#   CAD/SF1_Environment.stl.
#
#   Read only by src/Configuration/Core.py (Load_Configuration); nothing writes it.
#   Every field is REQUIRED: the loader fails, naming every missing or invalid field at once.
#   A key the loader does not know is reported as a WARNING.
#   Paths are relative to the repository root.
#
#   Frames: the world frame is the STL frame (metres). The Polyscope base frame (the frame of
#   every *_p pose) is the world frame translated by Robot.Base_Position and rotated by
#   Robot.Base_Yaw about z.
## =========================================================================== ##

# The environment: its visual mesh and its committed convex collision set.
Environment:
  # The workcell mesh, shown as is and never used for collision (MuJoCo would collide with its
  # single convex hull). REQUIRED. [path]
  Visual_Mesh: CAD/SF1_Environment.stl
  # The convex decomposition built by Example/build_collision.py (manifest beside it). REQUIRED. [path]
  Collision_Set: CAD/Collision/SF1_Environment_Collision.npz
  # Box selecting the robot stand: STL components whose bounding box lies fully inside it go to
  # the body env_stand, the only environment body excluded from collision with the robot base
  # (the base sits 0.2 mm above the stand profiles, measured, SPEC 4.1). REQUIRED, both. [m]
  Stand_Region:
    Min: [-0.35, -0.55, -0.01]
    Max: [0.35, 0.55, 0.716]
  # Rigid translations of whole STL objects applied before the collision set is built, for a
  # placement the real cell contradicts. An object is every component whose bounding box touches
  # another of it within 1 mm (SPEC 4.1). Each entry: Name, Object_Of (an STL component of the
  # object, as the build numbers them), Translation [x, y, z] in the world frame (at most 150 mm),
  # Source. The visual mesh is never changed; the manifest records the overrides and the members,
  # and the scene refuses a set built with others. REQUIRED (may be empty). [-, -, m, text]
  # machine_a: object (a), the machine with its front column, window frame and closed lower
  # cabinet (1749 components), about 150 mm further from the robot than the STL, normal to its
  # front: 100 mm, then a further 50 mm (owner, 2026-10-18; selection confirmed on renders). At the
  # 150 mm bound. side_cabinet: object (c), the side cabinet (56 components, y >= 0.555 m), about
  # 50 mm further along -x (owner, 2026-10-18). The robot stand and the tables (b) stay.
  Assembly_Overrides:
    - Name: machine_a
      Object_Of: 1154
      Translation: [-0.150, 0.0, 0.0]
      Source: owner estimate, 2026-10-18 (100 mm, then a further 50 mm), not measured
    - Name: side_cabinet
      Object_Of: 2643
      Translation: [-0.050, 0.0, 0.0]
      Source: owner estimate, 2026-10-18, not measured
  # Rigid translations of single STL components, added to any assembly translation, for geometry
  # the real cell contradicts. Each entry: Component (STL component id), Translation [x, y, z] in
  # the world frame (at most 150 mm), Source. REQUIRED (may be empty). [-, m, text]
  # None: with machine (a) at -150 mm the taught program keeps 39.1 mm or more to the left window
  # profile 2710 without a fit; its earlier fit (-15.7 mm on top of -100 mm) is removed (SPEC 4.11).
  Component_Overrides: []
  # Obstacles the STL does not contain, added to the environment (body env) as boxes aligned with
  # the world axes, collision only; a box that meets Clearance.Station_Zone is a zone piece. Each
  # entry: Name, Min and Max (lower and upper corner, world frame), Source. The collision set is not
  # rebuilt for them. REQUIRED (may be empty). [-, m, m, text]
  # station_bracket: the black U-shaped holder on the left window profile, under the part (owner
  # photo, 2026-10-18). It stays where the robot places the part (world-fixed): its front at
  # x -0.645 m, 90 mm in front of the post face fitted earlier; it is mounted on the post, so its
  # back reaches 8 mm into the post at its shifted face (x -0.762): -0.770 m (owner, 2026-10-18;
  # the extension costs no taught clearance, SPEC 4.11). y and the bottom from the photo (about
  # 80 mm wide); the top is the highest at which every taught sample of cases 17 and 18, the
  # release included, keeps 5 mm: 1.1126 m (the open finger), 17 mm above the photo's estimate of
  # 1.095 m (SPEC 4.10).
  # station_stub: the short vertical profile with the orange-framed piece on top, just above the
  # holder on the post face (owner photo, 2026-10-18; y and z from the photo, SPEC 4.8). Its depth
  # is not visible; it is modelled as large as the taught program allows (owner, 2026-10-18): from
  # 8 mm inside the shifted post face (x -0.762) to the farthest front at which every taught sample
  # of cases 17 and 18 keeps 5 mm, x -0.7274 m, 34.6 mm proud (bisection, 0.06 mm; SPEC 4.13).
  Added_Boxes:
    - Name: station_bracket
      Min: [-0.770, -0.340, 0.955]
      Max: [-0.645, -0.260, 1.112]
      Source: owner photo + taught points, back to the shifted post (owner, 2026-10-18), not measured
    - Name: station_stub
      Min: [-0.770, -0.330, 1.093]
      Max: [-0.7274, -0.270, 1.264]
      Source: owner photo + taught points, not measured

# The robot and its placement.
Robot:
  # MuJoCo Menagerie UR10e, vendored unchanged (models/MANIFEST.json). REQUIRED. [path]
  Model: models/universal_robots_ur10e/ur10e.xml
  # Origin of the Polyscope base frame in the world (STL) frame: the base sits at z = 715.2 mm on
  # the table (owner). REQUIRED. [m]
  Base_Position: [0.0, 0.0, 0.7152]
  # Rotation of the Polyscope base frame about the world z axis (owner, 2026-10-17; confirmed by the
  # taught points of sf1_plc_v4.script and photos of the real cell: at 180 the grasp points land on
  # the pallet and side tables and the machine drops inside machine (a); at 0 none does). An earlier
  # value of 0 was wrong (.claude/project-docs/design-decisions.md). REQUIRED. [deg]
  Base_Yaw: 180.0
  # Joint position limits in the order base, shoulder, elbow, wrist 1, wrist 2, wrist 3.
  # Hardware range +-360 deg, except the elbow: +-180 deg (Menagerie default, owner). The elbow
  # limit is the precondition for excluding upper_arm_link - forearm_link from self-collision;
  # the loader rejects an elbow limit beyond +-180 deg. The Polyscope safety limits of the cell
  # may be tighter (.claude/project-docs/KNOWN_ISSUES.md). REQUIRED, both. [deg]
  Joint_Position_Limits:
    Min: [-360.0, -360.0, -180.0, -360.0, -360.0, -360.0]
    Max: [360.0, 360.0, 180.0, 360.0, 360.0, 360.0]

# The tool: coupling, gripper and TCP.
Tool:
  # MuJoCo Menagerie Robotiq 2F-85, vendored unchanged (models/MANIFEST.json). REQUIRED. [path]
  Model: models/robotiq_2f85/2f85.xml
  # Robotiq coupling GRP-ES-CPL-062: thickness, outer diameter and the depth of the bore that
  # receives the gripper (Robotiq 2F-85 & 2F-140 for Universal Robots, Instruction Manual rev.
  # 2020/02/11, p. 119, Fig. 5-5). Flange face to gripper body = 16.9 - 2.9 = 14.0 mm, measured on
  # the robot by the owner (2026-10-17). REQUIRED, all three. [m]
  Coupling:
    Thickness: 0.0169
    Diameter: 0.075
    Spigot_Depth: 0.0029
  # Rotation of the gripper about the flange z axis relative to the Menagerie default. 0 = the
  # standard dowel-pin-indexed mounting; at 0 the fingers open along flange +-x. Confirmed on the
  # SF1 robot by the owner (2026-10-18; a statement of 90 deg made that day was withdrawn).
  # REQUIRED. [deg]
  Mount_Yaw: 0.0
  # Inner pad-face gap of a scene that names no case of the program (the demo, the tests): the
  # 50 x 50 mm part (owner). A path of a program case uses Holding_Openings. REQUIRED. [m]
  Opening: 0.050
  # Inner pad-face gap while the part of a case of a robot program is held, per program and case:
  # a case number names a case of one program only (owner, 2026-10-21). Used by the planning,
  # verification and replay of a job of that case (Configuration/Jobs/). Each entry: Program (its
  # folder under Data/Programs/), Case, Opening (> 0, at most the 85 mm stroke), Source. Case 18 has
  # no entry: its part's size is not known (an earlier 50 mm was an assumption, SPEC 8).
  # REQUIRED. [-, -, m, -]
  Holding_Openings:
    - {Program: sf1_plc_v4, Case: 17, Opening: 0.050, Source: 'owner, 2026-10-18: the 50 x 50 mm part'}
  # TCP in the flange frame [x, y, z, rx, ry, rz]: the Polyscope TCP of SF1 (owner, 2026-10-17),
  # identical to the Robotiq value (Instruction Manual rev. 2020/02/11, p. 127, section 5.2.3).
  # Configured, never derived from *_p. REQUIRED. [m, rad (rotation vector)]
  TCP_Offset: [0.0, 0.0, 0.174, 0.0, 0.0, 0.0]

# Minimum distances a configuration must keep.
Clearance:
  # Robot and gripper to the environment. It must also cover the unmodelled cables and the
  # kinematic error of nominal DH (budget: SPEC 9.8). REQUIRED. [m]
  Environment: 0.020
  # Between robot and gripper bodies that are not excluded. REQUIRED. [m]
  Self: 0.005
  # Pair-specific self margins [body, body, margin]. base - upper_arm_link passes within 2.3 mm
  # but never touches (SPEC 4.5, owner Q9 (a)); test/Scene/test_core.py establishes the true
  # minimum of every entry and fails if it is not > 0. REQUIRED (may be empty). [m]
  Self_Pair_Overrides:
    - [base, upper_arm_link, 0.0]
  # The station boxes, whose geometry is fitted to the taught program, not measured
  # (.claude/project-docs/KNOWN_ISSUES.md). Environment pieces whose bounding box meets the box
  # [Min, Max] (world frame) get the margin Environment instead of Clearance.Environment: always for taught segments, and
  # for a generated sample only while its TCP lies within Endpoint_Radius of a fixed station point.
  # Box: the station boxes' neighbourhood (owner, 2026-10-18; SPEC 4.12): the holder and stub boxes
  # and the sill frame they sit on (components 181, 1062, 2701, 2702, 2704, which no taught sample
  # comes within 20 mm of). Since the machine shift the station boxes are the only geometry the
  # taught program (cases 17 and 18) comes closer to than 20 mm (holder 5.5 mm, stub 5.03 mm); the
  # post keeps >= 39.1 mm, so it, the window's top profile and the machine front take the full
  # 20 mm: its position rests only on the owner's estimate, and a generated path may not use it.
  # Environment 5 mm: it covers eps (1 mm) and the measured kinematic error at the drop (4.0 mm),
  # nothing for cables (SPEC 9.8). Endpoint_Radius 50 mm: every taught sample under 20 mm (615) has
  # its TCP within 41.2 mm of a station point of its job (measured 2026-10-23, SPEC 4.12; 13.5 mm
  # before the stub was modelled). REQUIRED, all four. [m]
  Station_Zone:
    Min: [-0.755, -0.36, 0.94]
    Max: [-0.62, -0.24, 1.13]
    Environment: 0.005
    Endpoint_Radius: 0.050
  # Extra environment margin of generated segments to one assembly's pieces outside the station
  # zone: the accuracy of its estimated placement. machine_a: +-10 mm (owner, 2026-10-18), so a
  # generated path keeps Clearance.Environment + 10 = 30 mm to machine (a) outside the zone. Taught
  # segments, the station zone and every other object keep their margins (SPEC 9.7, 9.8).
  # REQUIRED, all three. [-, m, text]
  Machine_Extra:
    Assembly: machine_a
    Margin: 0.010
    Source: owner accuracy estimate of the machine position, 2026-10-18
  # The box a generated segment must keep every robot collision geom inside (world frame); taught
  # segments are not held to it. Space outside the STL is not modelled, so a new path may use only
  # space proved free by the taught program: x and y are the STL's extents (SPEC 4.1), z min the
  # STL's floor, z max 2.35 m, the highest point the taught rotation sequence reaches (2.322 m,
  # 2026-10-17) rounded up. REQUIRED, both. [m]
  Workspace:
    Min: [-1.609, -1.413, -0.002]
    Max: [0.934, 1.045, 2.35]

# Self-collision filtering. MuJoCo's automatic parent/child filter is disabled; only these apply.
Self_Collision:
  # Adjacent links whose hulls touch at the joint, never checked. REQUIRED. [body names]
  Excluded_Pairs:
    - [base, shoulder_link]
    - [shoulder_link, upper_arm_link]
    - [upper_arm_link, forearm_link]
    - [forearm_link, wrist_1_link]
    - [wrist_1_link, wrist_2_link]
    - [wrist_2_link, wrist_3_link]
    - [wrist_3_link, gripper_base_mount]
  # Groups of bodies rigid to each other; every pair inside a group is excluded. The gripper is
  # rigid at its fixed opening. REQUIRED. [body names]
  Rigid_Groups:
    - [gripper_base_mount, gripper_base, gripper_right_driver, gripper_right_coupler,
       gripper_right_spring_link, gripper_right_follower, gripper_right_pad, gripper_right_silicone_pad,
       gripper_left_driver, gripper_left_coupler, gripper_left_spring_link, gripper_left_follower,
       gripper_left_pad, gripper_left_silicone_pad]

# Kinematic checks of learned points.
Kinematics:
  # The most a learned point's DH FK * TCP may differ from its *_p before it is refused: half of
  # Clearance.Environment, independent of the measured residuals (SPEC 9.4). The orientation
  # bound is derived from it. REQUIRED. [m]
  FK_Sanity_Bound:
    Position: 0.010
